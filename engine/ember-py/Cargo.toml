[package]
name = "ember-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings (module ember_rs) for ember-rs: ContentPool and the batched environment BatchEnv"
publish = false

[lib]
name = "ember_py"
crate-type = ["cdylib"]

[dependencies]
ember = { package = "ember-rs", path = ".." }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py311"] }
numpy = "0.25"
rayon = "1.10"
serde_json = "1"
