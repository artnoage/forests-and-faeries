name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    name: Public Hygiene & Exclusions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 scripts/check_exclusions.py
          python3 game/release/make_ff_release.py --check
          python3 -m game.tools.asset_versions --check

  engine:
    name: Rust Engine & Golden Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --release --manifest-path engine/Cargo.toml

  rl-and-game-backend:
    name: RL Trainer, Web Backend & FFArena Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install Python dependencies & build ember_rs wheel
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest maturin
          pip install -r game/requirements.lock
          cargo build --release --manifest-path engine/Cargo.toml --bin ember
          maturin build --release --manifest-path engine/ember-py/Cargo.toml --out dist
          pip install --no-deps dist/*.whl
      - name: Run Game Server, Release & Lockstep Parity Suites
        env:
          PYTHONPATH: .
        run: pytest -q game/tests
      - name: Run RL Test Suite
        env:
          PYTHONPATH: rl
          EMBER_BIN: ${{ github.workspace }}/engine/target/release/ember
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: pytest -q rl/ember_rl/tests

  game-frontend:
    name: Game Frontend Bundle & Unit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: game/frontend/package-lock.json
      - working-directory: game/frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code ../static/scene3d.js
          node --test
